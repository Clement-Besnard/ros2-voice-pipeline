# Services the voice_pipeline nodes talk to: Whisper (STT), Kokoro (TTS) and n8n
# for automations.
#
# Ollama is NOT part of this stack - it runs on its own, see the README.
#
# Today both services run on the GPU server and the ROS nodes reach them over a
# VPN, so BIND_ADDR is set to the server's VPN address in .env. Nothing here is
# tied to that setup: copy .env.example to .env and set BIND_ADDR to whatever
# address should serve the pipeline (127.0.0.1 when the nodes run on the same
# machine, 0.0.0.0 to serve every interface). Neither service authenticates by
# default, so do not leave them on 0.0.0.0 on an untrusted network.

services:
  speaches:
    # Whisper, OpenAI-compatible: POST /v1/audio/transcriptions
    # Pinned on purpose: `latest-cuda` moves under your feet on the next pull.
    # Use a -cuda-12.4.1 tag instead if the host driver is too old for 12.6.
    image: ghcr.io/speaches-ai/speaches:0.8.3-cuda-12.6.3
    container_name: speaches
    restart: unless-stopped
    ports:
      # 8001 on the host to avoid a conflict on 8000
      - "${BIND_ADDR:-127.0.0.1}:8001:8000"
    environment:
      # Seconds a model stays loaded after its last use; -1 never unloads it,
      # like keep_alive does for Ollama, at the cost of holding the VRAM.
      # The setting is nested under WhisperConfig, hence the double underscore:
      # the flat STT_MODEL_TTL only exists from 0.9.0 and is ignored here.
      - WHISPER__TTL=${WHISPER_TTL:-300}
    volumes:
      - hf-hub-cache:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://0.0.0.0:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      # Probe every 5 s rather than every 30 s while starting, so it reports
      # healthy without a 30 s lag behind the server actually answering.
      start_interval: 5s
    depends_on:
      # The model is a prerequisite, not an afterthought: the server never
      # starts without one, instead of starting and 404-ing every utterance.
      # It is also what makes `docker compose up -d` block until the download
      # is over - compose starts a dependent only once the one-shot exits 0.
      speaches-init:
        condition: service_completed_successfully

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  speaches-init:
    # One-shot: puts the Whisper model in the volume, then exits. Runs before
    # the server, in the server's own image - so no extra pull, and the
    # HuggingFace cache is written exactly the way the server reads it back.
    # Skips the download when the model is already there, without touching the
    # network - see speaches/pull-model.py.
    image: ghcr.io/speaches-ai/speaches:0.8.3-cuda-12.6.3
    container_name: speaches_init
    restart: "no"
    environment:
      # Must match the `model` parameter of stt_node; nothing checks that.
      - STT_MODEL=${STT_MODEL:-Systran/faster-distil-whisper-large-v3}
    # Straight to python, around the CUDA image's entrypoint: this one needs
    # no GPU.
    entrypoint: ["python", "/bootstrap/pull-model.py"]
    volumes:
      - hf-hub-cache:/home/ubuntu/.cache/huggingface/hub
      - ./speaches:/bootstrap:ro

  kokoro:
    # Kokoro, OpenAI-compatible: POST /v1/audio/speech
    # cu126 build, fine from Maxwell to Ada (GTX 9xx through RTX 40xx).
    # RTX 50-series / Blackwell needs a -cu128 tag.
    image: ghcr.io/remsky/kokoro-fastapi-gpu:v0.9.2
    container_name: kokoro
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8880:8880"
    healthcheck:
      # Goes through Python so it does not depend on curl being in the image.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8880/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  n8n:
    # Automation layer, reached over HTTP like the rest. Nothing in the ROS
    # nodes calls it yet — see the README.
    # 2.48.5 is the current `stable`/`latest`; pinned for the same reason as above.
    image: docker.n8n.io/n8nio/n8n:2.48.5
    container_name: n8n_ros
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:5678:5678"
    extra_hosts:
      # Lets N8N_OLLAMA_URL point at an Ollama running on the host itself.
      # Unused when it points at a VPN or LAN address instead.
      - "host.docker.internal:host-gateway"
    environment:
      # Default is true, which drops the session cookie over plain HTTP from
      # anything but localhost — i.e. no login over the VPN. Set it back to
      # true the day n8n sits behind HTTPS.
      - N8N_SECURE_COOKIE=false
      # Host n8n believes it is reachable at: used in the editor URL and in the
      # webhook URLs it shows you. Harmless on localhost, wrong over a VPN.
      - N8N_HOST=${N8N_HOST:-localhost}
      # Timezone for the Schedule Trigger node, and for the container's clock.
      - GENERIC_TIMEZONE=${TZ:-Europe/Paris}
      - TZ=${TZ:-Europe/Paris}
      # Recommended by the n8n docs: 0600 on the settings file.
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      # N8N_RUNNERS_ENABLED is deliberately absent: deprecated since n8n 2.0,
      # task runners are on by default.
      #
      # Owner account declared up front (n8n 2.17+), so a fresh deploy comes up
      # with it already created instead of showing the signup screen. Opt-in:
      # left false, n8n behaves normally and the other four are ignored.
      # This never removes the login, it only skips the form.
      - N8N_INSTANCE_OWNER_MANAGED_BY_ENV=${N8N_OWNER_MANAGED:-false}
      - N8N_INSTANCE_OWNER_EMAIL=${N8N_OWNER_EMAIL:-}
      - N8N_INSTANCE_OWNER_FIRST_NAME=${N8N_OWNER_FIRST_NAME:-}
      - N8N_INSTANCE_OWNER_LAST_NAME=${N8N_OWNER_LAST_NAME:-}
      # bcrypt hash, never the password itself — see .env.example.
      - N8N_INSTANCE_OWNER_PASSWORD_HASH=${N8N_OWNER_PASSWORD_HASH:-}
    volumes:
      # Holds the SQLite database AND the auto-generated encryption key that
      # your stored credentials are encrypted with. Lose this volume and the
      # credentials in every workflow become unreadable.
      - n8n-data:/home/node/.n8n
    healthcheck:
      # Through node, which is certainly in this image, against n8n's /healthz.
      test: ["CMD", "node", "-e",
             "require('http').get('http://127.0.0.1:5678/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  n8n-init:
    # One-shot: seeds the instance with n8n/credentials and n8n/workflows, then
    # exits. Same image as above, so it costs no extra pull. It runs on every
    # `up` and overwrites those workflows from the repository - see n8n/bootstrap.sh.
    image: docker.n8n.io/n8nio/n8n:2.48.5
    container_name: n8n_ros_init
    restart: "no"
    depends_on:
      # The import commands need an instance owner, and only `n8n start` creates
      # one, so this cannot run before the server is up.
      n8n:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap.sh"]
    environment:
      # false skips the whole thing, for when the browser becomes the source of
      # truth for the workflows instead of this repository.
      - N8N_BOOTSTRAP=${N8N_BOOTSTRAP:-true}
      # Substituted into the JSON files. Ollama is not in this stack.
      - N8N_OLLAMA_URL=${N8N_OLLAMA_URL:-http://host.docker.internal:11434}
      - N8N_OLLAMA_MODEL=${N8N_OLLAMA_MODEL:-llama3.2}
      # Same folder, same SQLite database and same encryption key as the server.
      - N8N_USER_FOLDER=/home/node
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n:/bootstrap:ro

volumes:
  hf-hub-cache:
  n8n-data:

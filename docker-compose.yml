# Speech services for the voice_pipeline nodes: Whisper (STT) and Kokoro (TTS).
#
# Ollama is NOT part of this stack - it runs on its own, see the README.
#
# Today both services run on the GPU server and the ROS nodes reach them over a
# VPN, so BIND_ADDR is set to the server's VPN address in .env. Nothing here is
# tied to that setup: copy .env.example to .env and set BIND_ADDR to whatever
# address should serve the pipeline (127.0.0.1 when the nodes run on the same
# machine, 0.0.0.0 to serve every interface). Neither service authenticates by
# default, so do not leave them on 0.0.0.0 on an untrusted network.

services:
  speaches:
    # Whisper, OpenAI-compatible: POST /v1/audio/transcriptions
    # Pinned on purpose: `latest-cuda` moves under your feet on the next pull.
    # Use a -cuda-12.4.1 tag instead if the host driver is too old for 12.6.
    image: ghcr.io/speaches-ai/speaches:0.8.3-cuda-12.6.3
    container_name: speaches
    restart: unless-stopped
    ports:
      # 8001 on the host to avoid a conflict on 8000
      - "${BIND_ADDR:-127.0.0.1}:8001:8000"
    environment:
      # Default is 300 s, after which the model unloads and the next utterance
      # pays the reload. -1 keeps it resident, like keep_alive does for Ollama.
      - STT_MODEL_TTL=300
    volumes:
      - hf-hub-cache:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://0.0.0.0:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  kokoro:
    # Kokoro, OpenAI-compatible: POST /v1/audio/speech
    # cu126 build, fine from Maxwell to Ada (GTX 9xx through RTX 40xx).
    # RTX 50-series / Blackwell needs a -cu128 tag.
    image: ghcr.io/remsky/kokoro-fastapi-gpu:v0.9.2
    container_name: kokoro
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8880:8880"
    healthcheck:
      # Goes through Python so it does not depend on curl being in the image.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8880/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  hf-hub-cache:
